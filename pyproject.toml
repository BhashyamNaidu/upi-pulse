[project]
name = "upi-pulse"
version = "0.0.1"
description = "Local-first lakehouse on NPCI and RBI UPI payment statistics."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Bhashyam Naidu" }]
# Runtime dependencies are added phase by phase, only when code actually uses them.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upi_pulse"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=upi_pulse --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
markers = ["integration: end-to-end tests that need Spark (slower)"]

[tool.coverage.run]
source = ["upi_pulse"]
branch = true
